name: hookguard

# Checks the hook for known Uniswap v4 footguns on every pull request.
# Heuristic pattern matching, not an audit. Annotates only, never blocks.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: chaosxcode/hookguard@1fd0ddab626f2578a43ae377cc2a5903d9073a5a # v1
        with:
          paths: src
          fail-on: never
